<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d5560"/>
    </marker>
    <marker id="arrHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#0a0d12"/>

  <text x="48" y="48" font-size="24" font-weight="800" fill="#e6edf3">How it works — five lanes, one contract</text>
  <text x="48" y="74" font-size="13.5" fill="#8b949e">Same tools, same envelopes, same approvals. Only the transport changes — and every lane is kill-switchable back to stock.</text>

  <!-- Agent box -->
  <g>
    <rect x="48" y="110" width="180" height="230" rx="14" fill="#11151c" stroke="#262c36"/>
    <text x="138" y="146" text-anchor="middle" font-size="16" font-weight="800" fill="#e6edf3">Agent turn</text>
    <text x="138" y="172" text-anchor="middle" font-size="12" fill="#8b949e">read_file</text>
    <text x="138" y="192" text-anchor="middle" font-size="12" fill="#8b949e">search_files</text>
    <text x="138" y="212" text-anchor="middle" font-size="12" fill="#8b949e">terminal</text>
    <text x="138" y="232" text-anchor="middle" font-size="12" fill="#8b949e">execute_code RPC</text>
    <rect x="68" y="262" width="140" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="138" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">admission gate</text>
    <text x="138" y="304" text-anchor="middle" font-size="10.5" fill="#8b949e">fail-closed classifier</text>
  </g>

  <!-- lanes -->
  <g>
    <!-- lane 1 native read -->
    <rect x="300" y="100" width="330" height="64" rx="12" fill="#11151c" stroke="#262c36"/>
    <rect x="300" y="100" width="6" height="64" rx="3" fill="#f97316"/>
    <text x="322" y="126" font-size="14.5" font-weight="800" fill="#fbbf24">1 · Native read</text>
    <text x="322" y="148" font-size="12" fill="#8b949e">direct bytes + CRLF normalize — no shell, no spawn</text>

    <!-- lane 2 rg -->
    <rect x="300" y="176" width="330" height="64" rx="12" fill="#11151c" stroke="#262c36"/>
    <rect x="300" y="176" width="6" height="64" rx="3" fill="#f97316"/>
    <text x="322" y="202" font-size="14.5" font-weight="800" fill="#fbbf24">2 · Direct rg transport</text>
    <text x="322" y="224" font-size="12" fill="#8b949e">real ignore files, real regex, bounded JSON envelope</text>

    <!-- lane 3 warm terminal -->
    <rect x="300" y="252" width="330" height="64" rx="12" fill="#11151c" stroke="#262c36"/>
    <rect x="300" y="252" width="6" height="64" rx="3" fill="#f97316"/>
    <text x="322" y="278" font-size="14.5" font-weight="800" fill="#fbbf24">3 · Warm terminal</text>
    <text x="322" y="300" font-size="12" fill="#8b949e">one persistent shell, atomic snapshot commit</text>

    <!-- lane 4 parallel rpc -->
    <rect x="300" y="328" width="330" height="64" rx="12" fill="#11151c" stroke="#262c36"/>
    <rect x="300" y="328" width="6" height="64" rx="3" fill="#38bdf8"/>
    <text x="322" y="354" font-size="14.5" font-weight="800" fill="#7dd3fc">4 · Batched parallel RPC</text>
    <text x="322" y="376" font-size="12" fill="#8b949e">1–16 read ops, 4 workers, input order kept</text>

    <!-- lane 5 update survival -->
    <rect x="300" y="404" width="330" height="64" rx="12" fill="#11151c" stroke="#262c36"/>
    <rect x="300" y="404" width="6" height="64" rx="3" fill="#a78bfa"/>
    <text x="322" y="430" font-size="14.5" font-weight="800" fill="#c4b5fd">5 · Update survival</text>
    <text x="322" y="452" font-size="12" fill="#8b949e">hash-verified AST re-patch after harness updates</text>
  </g>

  <!-- arrows -->
  <g stroke="#fb923c" stroke-width="2" fill="none">
    <line x1="232" y1="150" x2="296" y2="132" marker-end="url(#arrHot)"/>
    <line x1="232" y1="190" x2="296" y2="205" marker-end="url(#arrHot)"/>
    <line x1="232" y1="230" x2="296" y2="282" marker-end="url(#arrHot)"/>
    <line x1="232" y1="270" x2="296" y2="356" marker-end="url(#arrHot)"/>
  </g>

  <!-- right column: guarantees -->
  <g>
    <rect x="690" y="100" width="462" height="170" rx="14" fill="#0d1117" stroke="#1f6feb" stroke-opacity="0.45"/>
    <text x="714" y="132" font-size="15" font-weight="800" fill="#7dd3fc">Non-negotiables</text>
    <text x="714" y="160" font-size="12.5" fill="#8b949e">✓ byte-identical output envelopes vs stock path</text>
    <text x="714" y="182" font-size="12.5" fill="#8b949e">✓ .gitignore / regex / pagination / guards all preserved</text>
    <text x="714" y="204" font-size="12.5" fill="#8b949e">✓ unsafe ops fall back to the regular sequential path</text>
    <text x="714" y="226" font-size="12.5" fill="#8b949e">✓ no writes or terminal calls admitted to parallel batches</text>
    <text x="714" y="248" font-size="12.5" fill="#8b949e">✓ every lane kill-switchable: TOOLRUSH_*=0 / toolrush.enabled</text>

    <rect x="690" y="290" width="462" height="178" rx="14" fill="#0d1117" stroke="#262c36"/>
    <text x="714" y="322" font-size="15" font-weight="800" fill="#4ade80">Proof, not vibes</text>
    <text x="714" y="350" font-size="12.5" fill="#8b949e">· 206 regression cases green, zero skipped</text>
    <text x="714" y="372" font-size="12.5" fill="#8b949e">· 5 negative controls — revert the fix, watch the test fail</text>
    <text x="714" y="394" font-size="12.5" fill="#8b949e">· failure SETS compared vs baseline (441-collected sweep)</text>
    <text x="714" y="416" font-size="12.5" fill="#8b949e">· live activation: real gateway + desktop restart, RPC verified</text>
    <text x="714" y="438" font-size="12.5" fill="#8b949e">· evidence: junit XML + raw benchmark samples in v2/evidence/</text>
  </g>
</svg>
